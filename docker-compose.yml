# The warehouse (and warehouse_test) and the read-only API. Dagster is added in Stage 5.
name: city-emissions-platform

services:
  db:
    # Pinned to Postgres 16 + PostGIS 3.5. A digest pin would be stricter still.
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by db/init/01-init.sh to create the least-privilege roles.
      PIPELINE_USER: ${PIPELINE_USER}
      PIPELINE_PASSWORD: ${PIPELINE_PASSWORD}
      API_READER_USER: ${API_READER_USER}
      API_READER_PASSWORD: ${API_READER_PASSWORD}
      # Read by db/init/02-test-db.sh to create warehouse_test and its roles.
      TEST_POSTGRES_DB: ${TEST_POSTGRES_DB}
      TEST_PIPELINE_USER: ${TEST_PIPELINE_USER}
      TEST_PIPELINE_PASSWORD: ${TEST_PIPELINE_PASSWORD}
      TEST_API_READER_USER: ${TEST_API_READER_USER}
      TEST_API_READER_PASSWORD: ${TEST_API_READER_PASSWORD}
      # Read by db/init/03-dagster-db.sh to create Dagster's own storage database.
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
    ports:
      # Bound to localhost only, so the DB is not exposed on your network.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run ONCE, the first time the data volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: city-emissions-api:local
    # ONLY the reader role's credentials: this container never sees the pipeline password,
    # and the API refuses any role that can do more than read `reporting` (api/db.py).
    # tests/test_compose.py fails if a pipeline or superuser variable is added here.
    environment:
      PGHOST: db
      POSTGRES_PORT: "5432"   # inside the Compose network, not the host port
      POSTGRES_DB: ${POSTGRES_DB}
      API_READER_USER: ${API_READER_USER}
      API_READER_PASSWORD: ${API_READER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Localhost only, like the database. No auth or rate limiting: see README Limitations.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Liveness (/health), not readiness: the container is healthy before reporting is
    # built; /ready answers 503 until then.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:

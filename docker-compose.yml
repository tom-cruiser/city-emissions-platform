# The warehouse (and warehouse_test), the read-only API, and Dagster (webserver + daemon).
name: city-emissions-platform

# Shared by both Dagster services: same image, same credentials.
x-dagster: &dagster
  build:
    context: .
    dockerfile: orchestration/Dockerfile
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}   # build with GIT_COMMIT=$(scripts/git-commit.sh)
  image: city-emissions-dagster:local
  # The pipeline role (writes raw, builds modelled/reporting) and Dagster's own storage
  # role. Never the API reader, the test roles or the superuser: tests/test_compose.py.
  environment:
    PGHOST: db
    POSTGRES_PORT: "5432"   # inside the Compose network, not the host port
    POSTGRES_DB: ${POSTGRES_DB}
    PIPELINE_USER: ${PIPELINE_USER}
    PIPELINE_PASSWORD: ${PIPELINE_PASSWORD}
    PIPELINE_TARGET: warehouse
    DAGSTER_PG_DB: ${DAGSTER_PG_DB}
    DAGSTER_PG_USER: ${DAGSTER_PG_USER}
    DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - raw-downloads:/app/data/raw          # downloaded source files, kept between runs
    - dagster-storage:/app/orchestration/storage   # compute logs (runs are in Postgres)
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    # Pinned to Postgres 16 + PostGIS 3.5. A digest pin would be stricter still.
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by db/init/01-init.sh to create the least-privilege roles.
      PIPELINE_USER: ${PIPELINE_USER}
      PIPELINE_PASSWORD: ${PIPELINE_PASSWORD}
      API_READER_USER: ${API_READER_USER}
      API_READER_PASSWORD: ${API_READER_PASSWORD}
      # Read by db/init/02-test-db.sh to create warehouse_test and its roles.
      TEST_POSTGRES_DB: ${TEST_POSTGRES_DB}
      TEST_PIPELINE_USER: ${TEST_PIPELINE_USER}
      TEST_PIPELINE_PASSWORD: ${TEST_PIPELINE_PASSWORD}
      TEST_API_READER_USER: ${TEST_API_READER_USER}
      TEST_API_READER_PASSWORD: ${TEST_API_READER_PASSWORD}
      # Read by db/init/03-dagster-db.sh to create Dagster's own storage database.
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
    ports:
      # Bound to localhost only, so the DB is not exposed on your network.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run ONCE, the first time the data volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: city-emissions-api:local
    # ONLY the reader role's credentials: this container never sees the pipeline password,
    # and the API refuses any role that can do more than read `reporting` (api/db.py).
    # tests/test_compose.py fails if a pipeline or superuser variable is added here.
    environment:
      PGHOST: db
      POSTGRES_PORT: "5432"   # inside the Compose network, not the host port
      POSTGRES_DB: ${POSTGRES_DB}
      API_READER_USER: ${API_READER_USER}
      API_READER_PASSWORD: ${API_READER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Localhost only, like the database. No auth or rate limiting: see README Limitations.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Liveness (/health), not readiness: the container is healthy before reporting is
    # built; /ready answers 503 until then.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  dagster-webserver:
    <<: *dagster
    ports:
      # Localhost only. The UI can start runs and has no login: never expose it.
      - "127.0.0.1:${DAGSTER_PORT:-3030}:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Runs schedules, the run queue and freshness evaluation. No ports.
  dagster-daemon:
    <<: *dagster
    command: ["dagster-daemon", "run", "-m", "orchestration.definitions"]

volumes:
  pgdata:
  raw-downloads:
  dagster-storage:

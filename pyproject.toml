[project]
name = "city-emissions-platform"
version = "0.1.0"
description = "Open city GHG emissions warehouse: PostGIS + dbt + Dagster + FastAPI"
# 3.12 only: the newest Python that dbt and Dagster are both well supported on.
requires-python = ">=3.12,<3.13"

# Direct dependencies are pinned exactly; uv.lock pins every transitive one too.
# Split by what runs where, so the API image installs only what the API needs:
#   (base)    shared by everything: settings, database driver
#   api       the FastAPI service (Docker image: uv sync --no-default-groups --group api)
#   pipeline  ingestion, dbt, Dagster
#   dev       everything, plus test and lint tools: what `uv sync` installs by default
dependencies = [
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "psycopg[binary]==3.3.8",
]

[dependency-groups]
api = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.8",  # Core only: connection pool + text() queries, no ORM
]
pipeline = [
    # Transformation
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
    # Ingestion
    "httpx==0.28.1",
    "openpyxl==3.1.5",
]
# Installed together with `pipeline` (the Dagster image runs ingestion and dbt).
orchestration = [
    "dagster==1.13.28",
    "dagster-dbt==0.29.28",
    "dagster-postgres==0.29.28",
    "dagster-webserver==1.13.28",
]
dev = [
    { include-group = "api" },
    { include-group = "pipeline" },
    { include-group = "orchestration" },
    "pytest==9.2.0",
    "ruff==0.17.3",
    # httpx (pipeline) also provides FastAPI's TestClient.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
